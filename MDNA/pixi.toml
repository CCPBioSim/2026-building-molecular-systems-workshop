# Optional: run the notebooks in a reproducible environment with pixi (https://pixi.sh).
# Start JupyterLab with `pixi run lab`. Without pixi, use requirements.txt.
[workspace]
name = "mdna-workshop"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[dependencies]
python = "3.14.*"
numpy = "*"
mdtraj = "*"
matplotlib = "*"
seaborn = "*"
jupyterlab = "*"
ipykernel = "*"

[pypi-dependencies]
mdna = "==0.2.0"
molviewspec = "*"   # 3D viewer in the notebooks, see devtools/viewer.py

[tasks]
lab = "jupyter lab"
# For organisers: rebuild and run the notebooks in solutions/ from the answers in devtools/answers/
solutions = "python devtools/make_solutions.py --execute"
