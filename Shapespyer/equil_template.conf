

structure             ionized.psf
coordinates           ionized.pdb
outputName            equil 

set temperature       300

set inputname         min
bincoordinates        $inputname.coor
binvelocities         $inputname.vel
extendedSystem        $inputname.xsc

firsttimestep         0

paraTypeCharmm	      on
parameters            toppar/par_all36_lipid.prm
parameters            toppar/par_all36_prot.prm
parameters            toppar/par_all27_prot_na.prm

wrapWater             on
wrapAll               on
wrapNearest           on

exclude               scaled1-4
1-4scaling            1.0
cutoff                14.
switching             on
switchdist            10.
pairlistdist          15

timestep              1.0  
rigidBonds            none  
nonbondedFreq         1
fullElectFrequency    2  
stepspercycle         20

PME                   yes
PMEGridSpacing 1.0

langevin              on    
langevinDamping       1     
langevinTemp          $temperature

useGroupPressure      yes 
useFlexibleCell       yes  
useConstantArea       no  

langevinPiston        on
langevinPistonTarget  1.01325 ;#  in bar -> 1 atm
langevinPistonPeriod  200.
langevinPistonDecay   50.
langevinPistonTemp    $temperature


restartfreq           1000     
dcdfreq               1000
xstFreq               1000
outputEnergies        1000
outputPressure        1000

constraints           on
consexp               1
consref               ionized.pdb
conskfile             ionized.fix
conskcol              B
margin                20

run                   1000000

