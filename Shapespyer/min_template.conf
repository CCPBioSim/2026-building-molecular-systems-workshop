

structure             ionized.psf
coordinates           ionized.pdb
outputName            min 

set temperature       300

firsttimestep         0

paraTypeCharmm	      on
parameters            toppar/par_all36_lipid.prm
parameters            toppar/par_all36_prot.prm
parameters            toppar/par_all27_prot_na.prm

temperature           $temperature
 
cellBasisVector1      62.9  0.    0.
cellBasisVector2      0.    58.9  0.
cellBasisVector3      0.    0.    100.6
cellOrigin            0.36 -0.27  0.04

wrapWater             on
wrapAll               on
wrapNearest           on

exclude               scaled1-4
1-4scaling            1.0
cutoff                14.
switching             on
switchdist            10.
pairlistdist          15

timestep              1.0  
rigidBonds            none  
nonbondedFreq         1
fullElectFrequency    2  
stepspercycle         20

PME                   yes
PMEGridSpacing 1.0

langevin              on    
langevinDamping       1     
langevinTemp          $temperature

useGroupPressure      yes 
useFlexibleCell       yes  
useConstantArea       no  

langevinPiston        on
langevinPistonTarget  1.01325 ;#  in bar -> 1 atm
langevinPistonPeriod  200.
langevinPistonDecay   50.
langevinPistonTemp    $temperature


restartfreq           1000     
dcdfreq               1000
xstFreq               1000
outputEnergies        1000
outputPressure        1000

constraints           on
consexp               2
consref               ionized.pdb
conskfile             ionized.fix
conskcol              B
margin                3

minimize              10000

